name: DCO

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check that every new commit is signed off by its author
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: |
          # A push that creates the branch has no previous commit; check the pushed one alone.
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="$HEAD~1"; fi
          scripts/check-dco.sh "$BASE..$HEAD"
